[project]
name = "hullforge-evals"
version = "0.1.0"
description = "Evaluation harness for HullForge: runs Claude Code against a live Unreal Engine editor and grades the editor's state"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jigwright", email = "support@jigwright.com" }]
requires-python = ">=3.13"
dependencies = ["hullforge-mcp"]

[tool.uv.sources]
hullforge-mcp = { path = "../hullforge-mcp", editable = true }

[project.scripts]
hf-eval = "evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]
